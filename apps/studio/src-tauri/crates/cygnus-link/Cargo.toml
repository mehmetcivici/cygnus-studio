[package]
name = "cygnus-link"
version = "0.1.0"
description = "GUI-free serial and TCP byte links for Cygnus Studio"
edition = "2021"
rust-version = "1.77"

[dependencies]
serialport = { version = "4", default-features = true }
serde = { version = "1", features = ["derive"] }
# Already in the app's dependency tree (tokio); used only for TCP keepalive tuning.
socket2 = "0.6"
