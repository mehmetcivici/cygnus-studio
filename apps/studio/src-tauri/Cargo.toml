[workspace]
members = ["crates/cygnus-link"]

[package]
name = "cygnus-studio"
version = "0.1.0"
description = "Cygnus Studio desktop shell"
authors = ["Cygnus Robotics"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cygnus_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cygnus-link = { path = "crates/cygnus-link" }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
